[workspace]
resolver = "2"
# areev-sandbox is a STANDALONE package, deliberately not a member: it carries
# wasmi, whose MSRV and dependency tree must not reach workspace `cargo deny`,
# MSRV checks, or test time. Built and tested on its own, invoked as a
# subprocess — the areev-js pattern, and the accepted D7 placement decision.
# `areev-tools` is excluded for the same reason and one more: its crates are
# `no_std` cdylibs for `wasm32-unknown-unknown`, so `cargo test --workspace`
# has no host to run them on. What ships from there is `dist/*.wasm` —
# committed, content-addressed blobs (#179).
exclude = ["areev-sandbox", "areev-tools"]
members = ["crates/areev-core", "crates/areev-store", "crates/areev-cal", "crates/areev-cli", "crates/areev-mcp", "crates/areev-context", "crates/areev-server", "crates/areev-py", "crates/areev-bench", "crates/areev-loop", "crates/areev-loop-adapter", "crates/areev-llm", "crates/areev-conformance", "crates/areev-run-core", "crates/areev-run", "crates/areev-trigger"]

[workspace.package]
version = "1.7.3"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["MindGryd Software Private Limited"]
repository = "https://github.com/AreevAI/areev"
homepage = "https://github.com/AreevAI/areev"
rust-version = "1.90.0"

[profile.release]
lto = "thin"
codegen-units = 1
