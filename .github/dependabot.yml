version: 2
updates:
  # Rust workspace dependencies (Cargo).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    groups:
      # The RustCrypto crates version in lockstep around `digest`: sha2 0.11 /
      # hkdf 0.13 / aes-gcm 0.11 are digest-0.11, and mixing generations does
      # not compile (see PRs #12, #8, #13). One grouped PR keeps the migration
      # atomic — and it should wait until turso leaves the digest-0.10 line,
      # or the tree carries two copies of the AES/GCM stack.
      rustcrypto:
        patterns:
          - "sha2"
          - "hkdf"
          - "hmac"
          - "aes-gcm"
          - "argon2"
          - "getrandom"
          - "digest"

  # Node bindings (napi) — Rust side. areev-js is a DETACHED cargo workspace
  # with its own Cargo.lock, so the "/" entry above does not reach it and its
  # lockfile drifts every time a crate it depends on gains a dependency.
  # release-npm.yml builds `--locked`, so that drift breaks a RELEASE.
  - package-ecosystem: cargo
    directory: "/crates/areev-js"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

  # Node bindings (napi) — standalone package, not in the Cargo workspace.
  - package-ecosystem: npm
    directory: "/crates/areev-js"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps

  # GitHub Actions workflow dependencies.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # dtolnay/rust-toolchain is versioned by TOOLCHAIN (e.g. @1.90.0), not by
      # action release — Dependabot misreads it and proposes nonexistent bumps
      # (e.g. 1.100.0) that would break the MSRV job. Bump it manually.
      - dependency-name: "dtolnay/rust-toolchain"
