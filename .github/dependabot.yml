version: 2
updates:
  # One entry so a crate held back in one lockfile is held back in both.
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/crates/areev-js"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    ignore:
      # logos 0.15+ changes `#[regex]` semantics and the CAL lexer is an OMS
      # conformance surface, so a lexer that parses differently is a spec change.
      - dependency-name: "logos"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # croner 3 reworked the schedule API the trigger evaluator is built on.
      - dependency-name: "croner"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # These version in lockstep around `digest` and mixing generations does
      # not compile. Blocked until turso leaves the digest-0.10 line.
      rustcrypto:
        patterns:
          - "sha2"
          - "hkdf"
          - "hmac"
          - "aes-gcm"
          - "argon2"
          - "getrandom"
          - "digest"

  - package-ecosystem: npm
    directory: "/crates/areev-js"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    groups:
      areev-js-npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # These edit the same files, so separate PRs conflict with each other.
      actions:
        patterns:
          - "*"
    ignore:
      # Versioned by toolchain (@1.90.0), not by action release — Dependabot
      # misreads it and proposes versions that do not exist. Bump manually.
      - dependency-name: "dtolnay/rust-toolchain"
