# Publish the Node bindings (crates/areev-js) to npm. Reads its target name
# from package.json — currently `@areev/areev` (unscoped `areev` is pending
# an npm similarity-filter exception; see CLAUDE.md's Status section).
#
# napi-rs ships a native addon per platform. This builds the `.node` for each
# target, then publishes one small platform package per target
# (`<name>-<platform>`) plus the thin main package that loads the right one at
# runtime via optionalDependencies (the layout the review flagged as missing).
#
# Trigger: on a published GitHub Release (tag `vX.Y.Z`) or manual dispatch.
# Prerequisite secret: `NPM_TOKEN` (an npm automation token for the account
# that owns the `areev` packages — it must have publish rights on whichever
# names package.json currently declares, scoped or not).
#
# NOTE: native cross-platform CI is finicky — watch the first release run and
# adjust the target matrix / napi flags to your installed @napi-rs/cli (v3) if a
# leg fails. The set of targets here must match `napi.targets` in package.json.
name: release-npm

on:
  release:
    types: [published]
  workflow_dispatch:

defaults:
  run:
    working-directory: crates/areev-js

permissions:
  contents: read

concurrency:
  group: release-npm-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  # index.js is GENERATED and hard-codes the expected version in every
  # platform arm. Bumping package.json without re-running `napi build` leaves
  # it asserting the previous version, and any consumer with
  # NAPI_RS_ENFORCE_VERSION_CHECK set then fails at require() against a
  # correctly installed package — this is exactly how 1.0.3 shipped stuck at
  # 1.0.1. Seconds here, versus a broken package on the registry.
  preflight:
    name: preflight (versions agree)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: Check every version site agrees
        run: |
          python3 scripts/check_versions.py \
            ${{ github.event_name == 'release' && format('--tag {0}', github.ref_name) || '' }}

  build:
    name: build ${{ matrix.settings.target }}
    needs: preflight
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: npx napi build --platform --release --target x86_64-apple-darwin -- --locked
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npx napi build --platform --release --target aarch64-apple-darwin -- --locked
          # Both Linux legs build NATIVELY, INSIDE a Debian 11 container:
          #   * in a container, because the *build host's* glibc becomes the
          #     addon's runtime floor. Built straight on ubuntu-latest (24.04,
          #     glibc 2.39) the addon installs fine on Debian 12 / Raspberry Pi
          #     OS Bookworm and then dies at require() with napi's misleading
          #     "Cannot find native binding … npm optional dependencies bug"
          #     (the real error is `GLIBC_2.39 not found`). Bullseye's 2.31
          #     floor covers Debian 11+/Ubuntu 20.04+/RPi OS Bullseye+. This is
          #     the npm-side equivalent of release-pypi.yml's manylinux images.
          #   * natively rather than cross-compiled, because turso's C deps
          #     (mimalloc/zstd) don't build under an old cross-gcc — the free
          #     arm64 runner removes the need to cross at all (same move as
          #     release-pypi.yml).
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: node:20-bullseye
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: node:20-bullseye
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: npx napi build --platform --release --target x86_64-pc-windows-msvc -- --locked
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: ${{ !matrix.settings.container }}
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.settings.container }}
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.settings.container }}
      - run: npm ci
        if: ${{ !matrix.settings.container }}
      - name: Build
        if: ${{ !matrix.settings.container }}
        run: ${{ matrix.settings.build }}

      # Linux: same build, run inside the old-glibc image. The non-slim node
      # image is buildpack-deps-based, so node + gcc + curl are already there
      # and nothing needs apt (Debian 11 leaves LTS in 2026 and its repos will
      # move to archive.debian.org — an `apt-get update` here would rot).
      # Root-owned outputs are fine; later steps only read them.
      - name: Build in ${{ matrix.settings.container }}
        if: ${{ matrix.settings.container }}
        working-directory: ${{ github.workspace }}
        run: |
          docker run --rm -v "$PWD":/build -w /build/crates/areev-js \
            -e TARGET=${{ matrix.settings.target }} \
            ${{ matrix.settings.container }} bash -c '
              set -eux
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              . "$HOME/.cargo/env"
              npm ci
              npx napi build --platform --release --target "$TARGET" -- --locked
            '

      # A too-new glibc floor is invisible until a user require()s the addon on
      # an older distro, and napi reports it as a missing binding. Fail here
      # instead. Plain grep, so it works on a foreign-arch ELF too.
      - name: Assert the glibc floor
        if: ${{ matrix.settings.container }}
        run: |
          need=$(grep -aoh 'GLIBC_[0-9]\+\.[0-9]\+' ./*.node | sort -uV | tail -1)
          echo "highest glibc symbol required: ${need:-none}"
          if [ "$(printf '%s\nGLIBC_2.31\n' "${need:-GLIBC_2.0}" | sort -V | tail -1)" != "GLIBC_2.31" ]; then
            echo "::error::addon requires $need, above the GLIBC_2.31 floor — it will fail to load on Debian 11/12 and Raspberry Pi OS"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/areev-js/*.node
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: build
    # Only a real release publishes — see the same guard in release-cli.yml.
    # Without it a `workflow_dispatch` ships whatever version is in
    # package.json to the registry, from any branch.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      # Build provenance + the SBOM asset (#81).
      id-token: write
      attestations: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          path: crates/areev-js/artifacts
      - name: Create platform package dirs
        run: npx napi create-npm-dirs
      - name: Collect per-platform binaries into npm/ dirs
        run: npx napi artifacts

      # Attest before publishing: an artifact on the registry that no
      # attestation covers is worse than one with none, because the security
      # model claims every artifact is attested. This one DOES gate the
      # publish — it is a security claim, not paperwork.
      - name: Attest build provenance for the native addons
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: crates/areev-js/npm/*/*.node
      - name: Publish platform packages + main to npm
        # We do NOT use `napi prepublish` here: it publishes every platform
        # package in one shot, and we want the main package to go out LAST so
        # a half-published release never advertises a platform that is not on
        # the registry yet.
        #
        # `prepare-npm.mjs` asserts that every target in `napi.targets` built,
        # stamps versions, wires optionalDependencies, and prints the dirs to
        # publish. Publishes skip anything already on the registry, so re-runs
        # are idempotent.
        #
        # The main package and per-platform packages publish under whatever
        # name is currently in package.json (`@areev/areev` + scoped platform
        # names as of 1.6.0 — unscoped `areev` still 403s npm's similarity
        # filter; see CLAUDE.md's Status section for where that stands). Any
        # OTHER 403 here is a real failure (auth/2FA/ownership); do NOT warn
        # past it — a manifest that promises a package npm refused breaks
        # `require()` on that platform (the pre-1.2.3 Windows incident).
        run: |
          set -euo pipefail
          publish_if_absent() { # $1 = package name, $2 = version, $3 = dir
            if [ "$(npm view "$1@$2" version 2>/dev/null || true)" = "$2" ]; then
              echo "$1@$2 already on npm — skipping"
            else
              echo "Publishing $1@$2"
              # --provenance (#81): npm's own registry-visible attestation,
              # generated from this workflow's OIDC identity. It is separate
              # from the GitHub attestation above and worth having both — this
              # is the one a consumer sees on the package page, and the one
              # `npm audit signatures` checks.
              (cd "$3" && npm publish --access public --provenance)
            fi
          }
          mapfile -t DIRS < <(node scripts/prepare-npm.mjs)
          for dir in "${DIRS[@]}"; do
            name=$(node -p "require('./$dir/package.json').name")
            ver=$(node -p "require('./$dir/package.json').version")
            publish_if_absent "$name" "$ver" "$dir"
          done
          main_name=$(node -p "require('./package.json').name")
          main_ver=$(node -p "require('./package.json').version")
          publish_if_absent "$main_name" "$main_ver" "."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Two SBOMs, because the package has two dependency graphs and only one
      # of them is visible to npm: `npm sbom` describes the JS tree, while
      # everything the addon actually links is Cargo's. Publishing only the
      # npm one would describe a package with almost no dependencies.
      #
      # AFTER the publish, and `continue-on-error`: a bill of materials is
      # documentation about a build, not the build, and it must never be able
      # to withhold a release from users. On the 1.5.2 tag it did exactly that
      # — a wrong flag here meant npm never got the packages at all.
      - name: Generate and attach the SBOMs
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p sbom
          (cd crates/areev-js && npm sbom --sbom-format cyclonedx --omit dev) \
            > "sbom/areev-${VERSION}-npm.cdx.json"
          rustup update stable
          cargo install cargo-cyclonedx --version 0.5.7 --locked
          # areev-js is NOT a workspace member, so it carries its own lockfile
          # and is described from its own manifest. cargo-cyclonedx takes
          # NEITHER `--locked` nor `-p`, ignores `--override-filename`, and
          # writes `<package>.cdx.json` beside the manifest; `--top-level` is
          # deliberately absent because it truncates to DIRECT dependencies.
          cargo cyclonedx --manifest-path crates/areev-js/Cargo.toml \
            --format json --spec-version 1.5
          cp crates/areev-js/areev-js.cdx.json "sbom/areev-${VERSION}-node-cargo.cdx.json"
          test -s "sbom/areev-${VERSION}-node-cargo.cdx.json"
          gh release upload "$GITHUB_REF_NAME" sbom/*.cdx.json --clobber --repo "$GITHUB_REPOSITORY"
