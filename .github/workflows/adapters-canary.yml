# The weekly canary: the same adapter suites against UNPINNED latest
# langgraph/crewai. CI proper tests the pinned floor; this job is the early
# warning when an upstream minor moves the surface (their cadence is
# aggressive — CrewAI deleted its entire memory system in a minor once).
# Failures here open the compatibility-matrix conversation; they never
# block merges.
name: adapters-canary
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

jobs:
  canary:
    name: adapters vs upstream latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@v2
      - name: Build areev + install adapters against latest upstreams
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip maturin pytest
          maturin develop -m crates/areev-py/Cargo.toml
          pip install --upgrade langgraph langgraph-checkpoint crewai
          pip install --no-deps -e adapters/areev-langgraph -e adapters/areev-crewai
          python -c "import importlib.metadata as md; print('langgraph', md.version('langgraph')); print('langgraph-checkpoint', md.version('langgraph-checkpoint')); print('crewai', md.version('crewai'))"
          pytest adapters/areev-langgraph/tests adapters/areev-crewai/tests -v
