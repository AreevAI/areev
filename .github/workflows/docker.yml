# The container image is packaging for the same binary the main CI already
# tests, so this workflow runs only when the packaging itself — or the
# dependency lockfile it compiles — changes. A full in-container release
# build on every PR would double CI time for no new signal.
#
# The one exception is the weekly schedule: the image scan's findings change
# without any commit (a new Debian advisory against the base image), so the
# image is rebuilt and rescanned on a cadence — the same reasoning as
# security.yml's weekly cargo-deny.
name: docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .trivyignore
      - docker/**
      - docker-compose.yml
      - Cargo.lock
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .trivyignore
      - docker/**
      - docker-compose.yml
      - Cargo.lock
      - .github/workflows/docker.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: image build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: build the image
        run: docker build -t areev .

      # Fails on any HIGH/CRITICAL finding that has a fix available
      # (`ignore-unfixed`: an advisory Debian has not patched yet is not
      # actionable by rebuilding). Accepted findings go in .trivyignore, each
      # with a reason. Pinned to the release's commit SHA, not its tag: this
      # action's tags have been re-pointed before (its older release tags were
      # all re-published on 2026-03-20), and a step that pulls a scanner and
      # a vulnerability DB should run exactly the code that was reviewed.
      - name: scan the image (HIGH/CRITICAL with a fix fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: areev
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: the sandbox ships beside the engine, version-matched
        run: |
          v=$(docker run --rm areev --version | cut -d' ' -f2)
          s=$(docker run --rm --entrypoint areev-sandbox areev --version | cut -d' ' -f2)
          echo "areev $v / areev-sandbox $s"
          [ "$v" = "$s" ] || { echo "::error::areev $v vs areev-sandbox $s"; exit 1; }
          docker run --rm --entrypoint sh areev -c 'command -v areev-sandbox'

      - name: a wasm32-areev plan dispatches to the sandbox
        run: |
          docker run --rm --entrypoint sh areev -c '
            set -eu
            DB=/data/wasm.db
            rpc() {
              { printf "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-06-18\",\"capabilities\":{},\"clientInfo\":{\"name\":\"s\",\"version\":\"1\"}}}\n"
                printf "%s\n" "$1"
              } | areev serve --mcp --db "$DB" | tail -1 | grep -oE "[0-9a-f]{64}" | head -1
            }
            printf "not wasm" > /tmp/bad.wasm
            HEX=$(areev blob put /tmp/bad.wasm --db "$DB" | tail -1 | grep -oE "[0-9a-f]{64}")
            TOOL=$(rpc "$(printf "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"areev_add\",\"arguments\":{\"type\":\"tool\",\"fields\":{\"tool_name\":\"w\",\"kind\":\"definition\",\"tool_description\":\"w\",\"executor_uri\":\"cas://sha256:%s\",\"runtime\":\"wasm32-areev\",\"created_at\":500}}}}" "$HEX")")
            WF=$(rpc "$(printf "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"areev_add\",\"arguments\":{\"type\":\"workflow\",\"fields\":{\"name\":\"p\",\"nodes\":[\"w\"],\"edges\":[],\"bindings\":{\"w\":\"%s\"},\"created_at\":501}}}}" "$TOOL")")
            out=$(areev run start --db "$DB" --workflow "$WF" --run-id wasm --input "{}" \
                    --allow-executor "$HEX" --sandbox-cmd areev-sandbox 2>&1)
            printf "%s\n" "$out"
            case "$out" in
              *"cannot dispatch"*|*"spawn areev-sandbox"*)
                echo "::error::the image cannot dispatch wasm32-areev"; exit 1 ;;
              *"areev-sandbox: module rejected"*)
                echo "the sandbox ran: the plan reached it and it judged the bytes" ;;
              *) echo "::error::unrecognised dispatch outcome"; exit 1 ;;
            esac
          '

      - name: the CLI works with zero flags ($AREEV_DB default)
        run: |
          docker volume create areev-smoke
          docker run --rm -v areev-smoke:/data areev add john prefers "window seat"
          docker run --rm -v areev-smoke:/data areev recall john | grep -q "window seat"

      - name: the console serves with a token, and refuses without one
        run: |
          docker run -d --name ui -v areev-smoke:/data -e AREEV_UI_TOKEN=smoke \
            --health-interval 2s --health-start-period 0s \
            -p 127.0.0.1:7437:7437 areev \
            ui --db /data/areev.db --ns caller --addr 0.0.0.0:7437 --allow-remote \
               --token-env AREEV_UI_TOKEN
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer smoke" http://127.0.0.1:7437/api/stats; then
              ok=1; break
            fi
            sleep 1
          done
          [ -n "$ok" ] || { docker logs ui; exit 1; }
          if curl -fsS http://127.0.0.1:7437/api/stats; then
            echo "unauthenticated read succeeded — the token gate is broken"; exit 1
          fi
          # /healthz is the one tokenless route, and the image HEALTHCHECK
          # reaches it from inside the container.
          curl -fsS http://127.0.0.1:7437/healthz
          health=""
          for i in $(seq 1 15); do
            health=$(docker inspect -f '{{.State.Health.Status}}' ui)
            [ "$health" = healthy ] && break
            sleep 1
          done
          [ "$health" = healthy ] || { docker inspect -f '{{json .State.Health}}' ui; exit 1; }
          docker rm -f ui

      - name: the heartbeat ticks
        run: |
          docker run -d --name hb -v areev-smoke:/data -e AREEV_HEARTBEAT_SECS=1 \
            --health-interval 1s --health-start-period 0s \
            areev heartbeat --ns caller
          sleep 4
          docker logs hb 2>&1 | grep -q "areev heartbeat: evaluating every 1s"
          # No HTTP endpoint in this role: the HEALTHCHECK must be a no-op
          # that reports healthy, not a probe that marks it unhealthy.
          [ "$(docker inspect -f '{{.State.Health.Status}}' hb)" = healthy ] \
            || { docker inspect -f '{{json .State.Health}}' hb; exit 1; }
          docker rm -f hb

      - name: the compose files parse
        run: |
          AREEV_UI_TOKEN=x docker compose config -q
          AREEV_UI_TOKEN=x POSTGRES_PASSWORD=x docker compose -f docker/compose.fleet.yml config -q
