# Publish the Python bindings (crates/areev-py) to PyPI as `areev`.
#
# Trigger: on a published GitHub Release (tag `vX.Y.Z`) or manual dispatch.
# Builds abi3 wheels (one per platform, works on CPython >= 3.9) for
# linux/macOS/windows + an sdist, then uploads.
#
# Prerequisite secret: `PYPI_API_TOKEN` (a PyPI API token scoped to the
# `areev` project). Alternatively switch to Trusted Publishing (OIDC): remove
# the token env below and configure the publisher on PyPI — the `id-token`
# permission is already granted.
name: release-pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time. A re-run racing a manual dispatch would otherwise
# publish two builds of the same version concurrently.
concurrency:
  group: release-pypi-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  # Version drift is silent and has shipped before: maturin reads
  # pyproject.toml, NOT Cargo's `version.workspace`, so a workspace-only bump
  # produces a green run that uploads nothing (skip-existing over the already
  # published version). Fail here, in seconds, instead.
  preflight:
    name: preflight (versions agree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every version site agrees
        run: |
          python3 scripts/check_versions.py \
            ${{ github.event_name == 'release' && format('--tag {0}', github.ref_name) || '' }}

  wheels:
    name: wheels (${{ matrix.platform.runner }} ${{ matrix.platform.target }})
    needs: preflight
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Build aarch64-linux NATIVELY on a free arm64 runner — cross-gcc
          # (any manylinux image) can't compile turso's mimalloc/zstd C deps
          # ("no option -Wdate-time"); a native arm64 gcc has no such issue.
          - { runner: ubuntu-latest,    target: x86_64,  manylinux: auto }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { runner: macos-latest,     target: x86_64,  manylinux: auto }
          - { runner: macos-latest,     target: aarch64, manylinux: auto }
          - { runner: windows-latest,   target: x64,     manylinux: auto }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # abi3-py39 is set in Cargo.toml, so one wheel covers CPython >= 3.9.
          # --locked: publish exactly the dependency graph CI tested. Without
          # it the release resolves fresh semver-compatible versions that no
          # test run ever saw.
          args: --release --locked --out dist -m crates/areev-py/Cargo.toml
          manylinux: ${{ matrix.platform.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: sdist
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/areev-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: publish to PyPI
    needs: [wheels, sdist]
    # Only a real release publishes. release-cli.yml already guards this way;
    # without it a `workflow_dispatch` from any branch uploads to PyPI for
    # real, which makes the dispatch unusable as a dry run.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # For Trusted Publishing, tie this to a `pypi` environment on the repo.
    permissions:
      id-token: write
      # Build provenance + the SBOM asset (#81).
      attestations: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # Attest before publishing: an artifact on the registry that no
      # attestation covers is worse than one with none, because the security
      # model claims every artifact is attested. This one DOES gate the
      # publish — it is a security claim, not paperwork.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.whl"
      # `maturin upload dist/*` would also try to upload the SBOM, which PyPI
      # rejects. Publish exactly the distributions.
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*.whl dist/*.tar.gz

      # The wheel is a compiled Rust extension, so its real dependency graph
      # is Cargo's, not pip's — `pip-audit` over the wheel would report a
      # package with no dependencies, which is true and useless. Describe the
      # graph that actually ships inside the binary.
      #
      # AFTER the publish, and `continue-on-error`: a bill of materials is
      # documentation about a build, not the build, and it must never be able
      # to withhold a release from users. On the 1.5.2 tag it did exactly that
      # — a wrong flag here meant PyPI never got the wheels at all.
      - name: Generate and attach the CycloneDX SBOM
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rustup update stable
          cargo install cargo-cyclonedx --version 0.5.7 --locked
          # Takes NEITHER `--locked` nor `-p`, ignores `--override-filename`,
          # and writes `<package>.cdx.json` beside the manifest. `--top-level`
          # is deliberately absent: it truncates to DIRECT dependencies.
          cargo cyclonedx --manifest-path crates/areev-py/Cargo.toml \
            --format json --spec-version 1.5
          VERSION="${GITHUB_REF_NAME#v}"
          cp crates/areev-py/areev-py.cdx.json "dist/areev-${VERSION}-python.cdx.json"
          test -s "dist/areev-${VERSION}-python.cdx.json"
          gh release upload "$GITHUB_REF_NAME" dist/*.cdx.json --clobber --repo "$GITHUB_REPOSITORY"
