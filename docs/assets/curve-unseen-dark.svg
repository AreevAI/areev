<title>Exact-match rate on registrants the agent never learned from as the deployment grows: Areev governed: LLM with the loop's rules 79% at 320; Areev tuned: 1.7B from scratch 93% at 320; Areev tuned: 1.7B continually 91% at 320.</title>
<desc>Documents learned from on a log axis. No memory is the day-one agent, read once per seed. mem0 stores each accountant exchange and retrieves into the prompt. The LLM carries the rules the governed loop had approved at each checkpoint; the small model is tuned on the filed rows up to it, from the plain base or from the previous checkpoint. Pooled over 3 seed(s); bars are 95% Wilson intervals where recorded.</desc>
