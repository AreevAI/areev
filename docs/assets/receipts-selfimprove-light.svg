<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 384" width="920" height="384" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif">
<title>Governed self-improvement on public receipts: run 1 reaches 70 of 720 exact against a rolled-back baseline of 97; cell C reaches 255 of 720 exact against a rolled-back baseline of 97; run 2 reaches 382 of 720 exact against a rolled-back baseline of 97.</title>
<desc>Left panel: learning curves over the same held-out receipts, scored after 0, 10, 20, 30 and 40 experience documents; every curve starts on the same shelf near 33 of about 240. run 1: seeds end at 33, 37, 0 of about 240, arm A pooled 97 of 720 and arm B 70, paired 3 wins to 30 losses. cell C: seeds end at 60, 135, 60 of about 240, arm A pooled 97 of 720 and arm B 255, paired 158 wins to 0 losses. run 2: seeds end at 123, 141, 118 of about 240, arm A pooled 97 of 720 and arm B 382, paired 286 wins to 1 losses. Right panel: pooled arms per cell. Arm A is the same height in every cell because the agent, documents, seeds and rollback path are identical, so the difference between the B bars is what each loop configuration learned and a reviewer approved.</desc>
