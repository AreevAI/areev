<text x="210.4" y="221" font-size="11" fill="#e9eaee">read $0 local <tspan fill="#9aa1ad">· $0.02 at a hosted small-model rate</tspan></text>
<line x1="202.4" y1="208" x2="202.4" y2="226" stroke="#a9c3e8" stroke-width="2" stroke-dasharray="3 2"/>
<text x="180" y="268" text-anchor="end" font-size="12" font-weight="600" fill="#7aa8e0">Areev — tuned SLM</text>
