<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif">
<title>Cost against quality: no memory at $0.05 per thousand documents and 13 percent exact; mem0 at $0.66 per thousand documents and 15 percent exact; mem0 (raw) at $0.16 per thousand documents and 17 percent exact; mem0 (domain) at $0.68 per thousand documents and 19 percent exact; small model + rules at $0.02 per thousand documents and 24 percent exact; Areev — governed at $0.66 per thousand documents and 53 percent exact; Areev — tuned SLM at $0.02 per thousand documents and 79 percent exact.</title>
<desc>Each arm is one point. Across: dollars per thousand documents when every document is both read and learned from. Up: exact-match rate on the held-out receipts. Better is up and to the left. Plain memory sits low and to the right of no memory; the governed loop sits high at the same cost as plain memory; the tuned small model sits highest and furthest left, priced at a hosted small-model rate with its one-time training noted.</desc>
