<title>Governed self-improvement on public ad-buy invoices: ad-buy reaches 590 of 840 exact against a rolled-back baseline of 122.</title>
<desc>Left panel: learning curves over the same held-out ad-buy invoices, scored after 0, 10, 20, 30 and 40 experience documents; every curve starts on the same shelf near 41 of about 285. ad-buy: seeds end at 224, 233, 133 of about 285, arm A pooled 122 of 840 and arm B 590, paired 468 wins to 0 losses. Right panel: pooled arms, rolled back against applied.</desc>
