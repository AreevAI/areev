<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif">
<title>Exact-match rate on the held-out receipts as the deployment proceeds: no memory ends at 13% over 3 seeds; mem0 ends at 15% over 3 seeds; mem0 (raw) ends at 17% over 3 seeds; mem0 (domain) ends at 19% over 3 seeds; Areev — governed ends at 53% over 3 seeds; small model + rules ends at 24% over 3 seeds; Areev — tuned SLM ends at 79% over 3 seeds.</title>
<desc>The same held-out receipts are re-read after 0, 10, 20, 30 and 40 experience documents. A memory system that stores what it is told but does not turn it into rules stays near the no-memory floor; the governed loop rises at the first checkpoint and holds. The tuned small model is a single point at 40, because it is trained once from the governed memory.</desc>
