<title>Exact-match rate on the next 20 documents of the stream (prequential) as the deployment grows: LLM with the checkpoint's rules 78% at 160; 1.7B tuned from scratch 92% at 160; 1.7B tuned continually 86% at 160; governed agent as it ran 80% at 160.</title>
