<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 384" width="920" height="384" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif">
<title>Governed self-improvement on public receipts: run 2 reaches 382 of 720 exact against a rolled-back baseline of 97, 286 paired wins to 1 loss; run 1, one engine defect earlier, reaches 70 of 720 and loses 30 to 3.</title>
<desc>Left panel: six learning curves over the same 60 held-out ICDAR-SROIE receipts, scored after 0, 10, 20, 30 and 40 experience receipts. All six start together near 31 of 240. Run 2 seeds 1, 2 and 3 rise at the first checkpoint to 124, 141 and 125 and hold, ending at 123, 141 and 118. Run 1 seeds stay flat at 31 and 36, or swing to 86 and fall to 33, or drop to 0 and stay there. Right panel: pooled arms. Run 1 arm A 97 of 720 and arm B 70; run 2 arm A 97 of 720 and arm B 382. Arm A is identical across both runs because the agent, receipts, seeds and rollback path are identical, so the difference between the B bars is what the loop learned and a reviewer approved.</desc>
