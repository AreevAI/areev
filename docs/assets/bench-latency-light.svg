<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" role="img" aria-label="Areev recall latency, measured p50: 9 to 158 microseconds across every surface on a laptop, 361 microseconds on a 2016 Raspberry Pi 3, flat from 500 to 8,000 grains">
