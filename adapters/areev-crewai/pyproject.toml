[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "areev-crewai"
version = "1.0.0"
description = "Areev storage backend for CrewAI memory: supersession-based updates, audited deletes, and right-to-erasure over memory sources"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "AreevAI" }]
dependencies = [
    "areev>=1.0.0",
    "crewai>=1.10,<2",
]
keywords = ["crewai", "memory", "storage", "areev", "audit", "gdpr"]

[project.urls]
Homepage = "https://github.com/AreevAI/areev"

[tool.setuptools]
packages = ["areev_crewai"]
