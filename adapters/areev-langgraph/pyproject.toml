[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "areev-langgraph"
version = "1.0.0"
description = "Areev persistence for LangGraph: a BaseStore and a BaseCheckpointSaver over content-addressed, governable memory files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "AreevAI" }]
dependencies = [
    "areev>=1.0.0",
    "langgraph-checkpoint>=4.2,<5",
]
keywords = ["langgraph", "checkpointer", "store", "memory", "areev", "audit"]

[project.optional-dependencies]
# The store type-checks against langgraph's BaseStore, which ships in the
# main package; the checkpointer needs only langgraph-checkpoint.
langgraph = ["langgraph>=1.0,<2"]

[project.urls]
Homepage = "https://github.com/AreevAI/areev"

[tool.setuptools]
packages = ["areev_langgraph"]
