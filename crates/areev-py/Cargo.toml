[package]
name = "areev-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Python bindings for Areev, the embedded memory engine for AI agents."
readme = "README.md"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["memory", "python", "ai-agents", "llm", "bindings"]
categories = ["api-bindings"]
publish = false

[features]
# The postgres backend ships ON in the binding: it is a server-side surface,
# and `Areev("postgres://…?schema=<name>")` must work from a stock
# `pip install areev`. The dependency-light default stays with the `areev`
# CLI and the store crate.
# `postgres-tls` rides with it for the same reason: the managed Postgres a
# binding user points at (Azure Flexible Server, RDS, Cloud SQL) requires TLS
# on the wire, and a wheel installer cannot recompile to add a cargo feature.
# rustls is already in this crate's graph via areev-llm's HTTP client, so the
# artifact grows by a connector, not by a TLS stack.
default = ["postgres", "postgres-tls"]
postgres = ["areev-store/postgres"]
postgres-tls = ["postgres", "areev-store/postgres-tls"]

[lib]
name = "areev"
crate-type = ["cdylib"]

[dependencies]
areev-core = { path = "../areev-core", version = "1.6.0" }
areev-store = { path = "../areev-store", version = "1.6.0" }
areev-cal = { path = "../areev-cal", version = "1.6.0" }
areev-loop = { path = "../areev-loop" }
areev-loop-adapter = { path = "../areev-loop-adapter" }
areev-llm = { path = "../areev-llm" }
areev-run = { path = "../areev-run" }
areev-trigger = { path = "../areev-trigger" }
serde_json = "1"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
