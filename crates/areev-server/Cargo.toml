[package]
name = "areev-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Web console and sync-hub server for Areev."
readme = "README.md"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["memory", "server", "sync", "ai-agents", "http"]
categories = ["web-programming::http-server"]

[dependencies]
areev-core = { path = "../areev-core", version = "1.0.2" }
areev-store = { path = "../areev-store", version = "1.0.2" }
areev-cal = { path = "../areev-cal", version = "1.0.2" }
areev-context = { path = "../areev-context", version = "1.0.2" }
areev-loop = { path = "../areev-loop", version = "1.0.2" }
areev-run = { path = "../areev-run", version = "1.0.2" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1.15", features = ["std"], optional = true }
areev-loop-adapter = { path = "../areev-loop-adapter", version = "1.0.2" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[features]
# Native TLS — the recorded dependency-policy exception (ARCHITECTURE.md
# decision log): rustls only, non-default, for deployments with nowhere to
# put the documented TLS-terminating proxy.
tls = ["dep:rustls", "dep:rustls-pki-types"]
