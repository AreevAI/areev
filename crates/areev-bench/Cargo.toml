[package]
name = "areev-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Internal benchmark harness for Areev (not published)."
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
areev-core = { path = "../areev-core", version = "1.5.0" }
# `cargo run -p areev-bench --features postgres --bin pg_bench` — the
# server-tier latency harness (needs DATABASE_URL).

areev-store = { path = "../areev-store", version = "1.5.0" }
areev-cal = { path = "../areev-cal", version = "1.5.0" }
areev-context = { path = "../areev-context", version = "1.5.0" }
areev-server = { path = "../areev-server", version = "1.5.0" }
areev-loop = { path = "../areev-loop" }
areev-llm = { path = "../areev-llm" }
serde_json = "1"
turso = "0.7.0"
tokio = { version = "1", features = ["rt"] }
tempfile = "3"

[features]
postgres = ["areev-store/postgres"]
