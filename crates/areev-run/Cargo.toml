# The DRIVER of `areev run` (governed-agents §4): a host over Areev, peer of
# areev-mcp. Owns everything the pure core cannot: the store, the clock, the
# executors, the journal, resume/verify, budgets' price table, and the HITL
# respond path. Nothing under `areev-*`'s memory stack or loop depends on
# this crate — it composes them.
[package]
name = "areev-run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Areev agent runtime driver: executes OMS Workflow grains over the deterministic scheduler core, journaling every effect as content-addressed grains — intent before dispatch, result as supersession — with checkpoints, resume, verify, HITL respond, budgets, and cancel."
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ai-agents", "workflow", "runtime", "deterministic", "areev"]
categories = ["development-tools"]

[dependencies]
areev-core = { path = "../areev-core", version = "1.2.2" }
areev-store = { path = "../areev-store", version = "1.2.2" }
areev-cal = { path = "../areev-cal", version = "1.2.2" }
areev-run-core = { path = "../areev-run-core", version = "1.2.2" }
# The ToolCallLlm seam for abstract nodes (§6.2/§6.11).
areev-llm = { path = "../areev-llm", version = "1.2.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
