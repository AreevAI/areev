# The DRIVER of `areev run` (governed-agents §4): a host over Areev, peer of
# areev-mcp. Owns everything the pure core cannot: the store, the clock, the
# executors, the journal, resume/verify, budgets' price table, and the HITL
# respond path. Nothing under `areev-*`'s memory stack or loop depends on
# this crate — it composes them.
[package]
name = "areev-run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Areev agent runtime driver: executes OMS Workflow grains over the deterministic scheduler core, journaling every effect as content-addressed grains — intent before dispatch, result as supersession — with checkpoints, resume, verify, HITL respond, budgets, and cancel."
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ai-agents", "workflow", "runtime", "deterministic", "areev"]
categories = ["development-tools"]

[dependencies]
areev-core = { path = "../areev-core", version = "1.10.0" }
areev-store = { path = "../areev-store", version = "1.10.0" }
areev-cal = { path = "../areev-cal", version = "1.10.0" }
areev-run-core = { path = "../areev-run-core", version = "1.10.0" }
# The ToolCallLlm seam for abstract nodes (§6.2/§6.11).
#
# `default-features = false` (#289): this crate names only seam TYPES
# (`ToolCallLlm`, `ToolCallRequest`, `ChatMessage`, …) and never calls the
# provider factory. Cargo unifies features across a dependency graph, so
# leaving the defaults on here compiled the openai, anthropic and ollama
# factory arms into every crate downstream of the runtime — areev-mcp,
# areev-trigger, areev-server — and a host that declared areev-llm with
# `default-features = false` got all three anyway. The feature flags exist so
# a regulated build can state which model endpoints its artifact can REACH;
# that statement was not true through this edge.
#
# The hosts that DO call the factory (areev-cli, areev-py, areev-js,
# areev-bench) depend on areev-llm directly and keep their defaults.
areev-llm = { path = "../areev-llm", version = "1.10.0", default-features = false }
# The egress broker's outbound leg (moved here from areev-trigger, which
# depends on this crate and so could not share it).
ureq = "3"
# Capability tokens for the broker. Already in the tree via areev-store.
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Already in the lockfile via areev-core / areev-store; adds no new package.
# sha2 0.11's digest output no longer implements LowerHex, so the audit
# trail's `sha256:<hex>` is rendered explicitly rather than via `{:x}`.
hex = "0.4"

[dev-dependencies]
tempfile = "3"
