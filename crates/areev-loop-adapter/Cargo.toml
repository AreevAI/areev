[package]
name = "areev-loop-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Areev substrate adapter for the Areev Loop engine: implements areev_loop::OmsSubstrate over AreevFacade so `areev loop` runs against real .mg/Turso memory files."
readme = "README.md"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ai-agents", "memory", "loop", "self-improvement", "areev"]
categories = ["algorithms"]

[dependencies]
areev-loop = { path = "../areev-loop", version = "1.6.0" }
areev-core = { path = "../areev-core", version = "1.6.0" }
areev-store = { path = "../areev-store", version = "1.6.0" }
areev-cal = { path = "../areev-cal", version = "1.6.0" }
areev-run-core = { path = "../areev-run-core", version = "1.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
