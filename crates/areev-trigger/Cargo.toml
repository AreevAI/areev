[package]
name = "areev-trigger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Areev triggers: declared as grains, evaluated by a one-shot idempotent command, safe to invoke concurrently."
readme = "README.md"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ai-agents", "memory", "scheduling", "triggers", "oms"]
categories = ["database"]

[dependencies]
areev-core = { path = "../areev-core", version = "1.10.0" }
areev-store = { path = "../areev-store", version = "1.10.0" }
areev-cal = { path = "../areev-cal", version = "1.10.0" }
areev-run = { path = "../areev-run", version = "1.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Already in the tree for areev-cal / areev-cli / areev-context.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Pinned to 2.x ON PURPOSE. 2.2.0's only non-optional dependency is chrono,
# which we already have, so this adds ZERO new crates. 3.x adds derive_builder
# and strum, dragging in the syn/quote/proc-macro2 chain — which is exactly the
# kind of growth the dependency-light policy exists to stop.
croner = { version = ">=2.2, <3", default-features = false }
# IANA zone data for cron-in-a-firm's-time-zone (#297). Behind a feature
# because it is ~800 KB of tables that a UTC-only deployment has no use for,
# and because a build WITHOUT it must keep refusing a non-UTC zone by name
# rather than silently evaluating it somewhere else. Enabled by the CLI and
# both binding builds — the three hosts that evaluate triggers — because a
# memory is evaluated by several hosts, and they must agree on when a trigger
# is due.
#
# System zoneinfo is deliberately not an option: two hosts reading two
# different `/usr/share/zoneinfo` snapshots would disagree about the same
# declaration, which is the failure a content-addressed declaration exists
# to make impossible.
chrono-tz = { version = "0.10", default-features = false, optional = true }

[features]
default = []
tz = ["dep:chrono-tz"]

[dev-dependencies]
tempfile = "3"
areev-run-core = { path = "../areev-run-core", version = "1.10.0" }
