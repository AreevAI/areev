[package]
name = "areev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Command-line interface for Areev, the embedded memory engine for AI agents."
readme = "README.md"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["memory", "cli", "ai-agents", "llm", "database"]
categories = ["command-line-utilities", "database-implementations"]

[[bin]]
name = "areev"
path = "src/main.rs"

[features]
# `areev --db postgres://…?schema=<name>` — the server-tier backend. Non-
# default: the published edge binary stays dependency-light.
postgres = ["areev-store/postgres"]
# TLS on the DSN (`sslmode=`/`sslrootcert=`), so a managed Postgres that
# requires encryption needs no proxy hop. Without it such a DSN is refused
# (STO-E003), never downgraded.
postgres-tls = ["postgres", "areev-store/postgres-tls"]
# Native TLS for `areev ui` (rustls; the recorded dependency
# exception). Non-default: the proxy pattern stays the documented default.
tls = ["areev-server/tls"]
# Native OIDC login for `areev ui` (the second recorded dependency
# exception). Non-default, same posture as `tls`: an authenticating proxy
# (--sso-header) stays the documented default, and this is for deployments
# that cannot run one — or that need an approver identity stronger than a
# shared proxy secret can carry. See docs/auth-proposal.md §6.
oidc = ["areev-server/oidc"]

[dependencies]
areev-core = { path = "../areev-core", version = "1.6.0" }
areev-store = { path = "../areev-store", version = "1.6.0" }
areev-cal = { path = "../areev-cal", version = "1.6.0" }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
zeroize = "1"
# Already in the lockfile via areev-store/areev-run; adds no new package.
# `areev auth mint` needs OS randomness so an operator never chooses a token.
getrandom = "0.4"
# Already in the lockfile via areev-core; adds no new package. Used to parse
# ISO-8601 transcript timestamps so capture-stop can pin created_at.
chrono = { version = "0.4", default-features = false, features = ["std"] }

areev-mcp = { path = "../areev-mcp", version = "1.6.0" }
areev-context = { path = "../areev-context", version = "1.6.0" }
areev-server = { path = "../areev-server", version = "1.6.0" }
areev-loop = { path = "../areev-loop", version = "1.6.0" }
areev-loop-adapter = { path = "../areev-loop-adapter", version = "1.6.0" }
areev-llm = { path = "../areev-llm", version = "1.6.0" }
areev-run = { path = "../areev-run", version = "1.6.0" }
areev-trigger = { path = "../areev-trigger", version = "1.6.0" }
areev-run-core = { path = "../areev-run-core", version = "1.6.0" }

[dev-dependencies]
tempfile = "3"
