[package]
name = "areev-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Backend-parameterized conformance suite for the Areev store (not published)."
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
postgres = ["areev-store/postgres"]
# Run the Pg case list against a server that requires TLS (a managed backend):
# `DATABASE_URL='postgres://…?sslmode=verify-full' cargo test -p areev-conformance
#  --features postgres-tls`. Everything that goes through a `Areev` handle works;
# the outage case skips, because its `pg_terminate_backend` side channel is a
# raw NoTls connection rather than a store session.
postgres-tls = ["postgres", "areev-store/postgres-tls"]

[dependencies]
areev-core = { path = "../areev-core" }
areev-store = { path = "../areev-store" }
tempfile = "3"
serde_json = "1"

[dev-dependencies]
# The CAL-over-backend smoke drives the full stack (executor -> facade ->
# store) against each backend.
areev-cal = { path = "../areev-cal" }
# ONLY for the reconnect-after-outage case: simulating a managed-Postgres
# restart means terminating the store's backend from a SECOND connection
# (`pg_terminate_backend`), which no public store API can or should do. Both
# crates are already in the tree behind `areev-store/postgres`; this is a
# dev-dependency on a `publish = false` crate, so it adds nothing to any
# shipped artifact.
tokio = { version = "1", features = ["rt", "macros"] }
tokio-postgres = "0.7"
