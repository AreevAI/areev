[package]
name = "areev-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Out-of-box LLM provider backends for Areev and Areev Loop: OpenAI-compatible, Anthropic, and Ollama adapters over a small blocking HTTP client, implementing areev_loop::LlmBackend, plus the free-text-to-Fact extraction used by remember(). Keeps the core crates dependency-light — the HTTP surface lives here."
readme = "README.md"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ai-agents", "llm", "loop", "self-improvement", "areev"]
categories = ["api-bindings"]

[dependencies]
areev-loop = { path = "../areev-loop", version = "1.0.1" }
# Wave 0 (governed-agents §6.11): the ToolCallLlm seam renders Tool
# Definition grains to each provider's native tools format via core's
# tool_schema module — workspace-internal, no new external surface.
areev-core = { path = "../areev-core", version = "1.0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A small BLOCKING HTTP client — matches the sync-over-private-runtime / std
# TcpListener posture of the rest of the tree; no tokio/reqwest enters here.
ureq = "3"
